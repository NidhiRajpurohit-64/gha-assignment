name: Release Notes

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version
        required: true
        default: "1.0.0"
        type: string

      release_type:
        description: Release type
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  prepare:
    runs-on: ubuntu-latest

    outputs:
      build_tag: ${{ steps.prepare.outputs.build_tag }}
      build_date: ${{ steps.prepare.outputs.build_date }}

    steps:
      - name: Prepare build information
        id: prepare
        run: |
          BUILD_TAG="v${{ inputs.version }}-${{ inputs.release_type }}-${GITHUB_RUN_NUMBER}"
          BUILD_DATE="$(date +%Y-%m-%d)"

          echo "build_tag=$BUILD_TAG" >> "$GITHUB_OUTPUT"
          echo "build_date=$BUILD_DATE" >> "$GITHUB_OUTPUT"

          echo "Build tag: $BUILD_TAG"
          echo "Build date: $BUILD_DATE"

  announce:
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - name: Print outputs
        run: |
          echo "Build tag: ${{ needs.prepare.outputs.build_tag }}"
          echo "Build date: ${{ needs.prepare.outputs.build_date }}"

      - name: Write summary
        run: |
          echo "## Release Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | ${{ inputs.version }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Release Type | ${{ inputs.release_type }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build Tag | ${{ needs.prepare.outputs.build_tag }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build Date | ${{ needs.prepare.outputs.build_date }} |" >> "$GITHUB_STEP_SUMMARY"
